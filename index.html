<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
    background: #f4f5f7;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    margin: 0 0 20px;
    font-size: 24px;
    color: #1f2933;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #item-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
  }
  #item-input:focus {
    border-color: #4f46e5;
  }
  #add-btn {
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #4f46e5;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  #add-btn:hover { background: #4338ca; }
  .summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 12px;
  }
  #clear-checked-btn {
    background: none;
    border: none;
    color: #ef4444;
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  #clear-checked-btn:hover { text-decoration: underline; }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li.item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #eef0f2;
  }
  li.item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #4f46e5;
    cursor: pointer;
    flex-shrink: 0;
  }
  li.item .label {
    flex: 1;
    font-size: 15px;
    color: #1f2933;
    word-break: break-word;
  }
  li.item.checked .label {
    text-decoration: line-through;
    color: #9ca3af;
  }
  li.item .delete-btn {
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  li.item .delete-btn:hover {
    color: #ef4444;
    background: #fee2e2;
  }
  .empty {
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
    padding: 32px 0;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; }
    .app { background: #1f2937; box-shadow: none; }
    h1 { color: #f9fafb; }
    #item-input {
      background: #111827;
      border-color: #374151;
      color: #f9fafb;
    }
    li.item {
      background: #111827;
      border-color: #374151;
    }
    li.item .label { color: #f3f4f6; }
    li.item.checked .label { color: #6b7280; }
    .summary { color: #9ca3af; }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" maxlength="100" autofocus>
      <button id="add-btn">추가</button>
    </div>
    <div class="summary">
      <span id="count-text">0개 항목</span>
      <button id="clear-checked-btn">체크된 항목 삭제</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty-msg">목록이 비어 있습니다. 물건을 추가해 보세요!</div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'shopping-list-items';
  const input = document.getElementById('item-input');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('list');
  const emptyMsg = document.getElementById('empty-msg');
  const countText = document.getElementById('count-text');
  const clearCheckedBtn = document.getElementById('clear-checked-btn');

  let items = loadItems();

  function loadItems() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function render() {
    list.innerHTML = '';
    if (items.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
      items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item' + (item.checked ? ' checked' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.checked;
        checkbox.addEventListener('change', () => toggleItem(item.id));

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = item.text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '✕';
        deleteBtn.title = '삭제';
        deleteBtn.addEventListener('click', () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(label);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    const checkedCount = items.filter(i => i.checked).length;
    countText.textContent = items.length === 0
      ? '0개 항목'
      : `${items.length}개 항목 (${checkedCount}개 완료)`;
  }

  function addItem() {
    const text = input.value.trim();
    if (!text) return;
    items.push({ id: Date.now() + Math.random(), text, checked: false });
    input.value = '';
    saveItems();
    render();
    input.focus();
  }

  function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (item) item.checked = !item.checked;
    saveItems();
    render();
  }

  function deleteItem(id) {
    items = items.filter(i => i.id !== id);
    saveItems();
    render();
  }

  function clearChecked() {
    items = items.filter(i => !i.checked);
    saveItems();
    render();
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addItem();
  });
  clearCheckedBtn.addEventListener('click', clearChecked);

  render();
})();
</script>
</body>
</html>
